name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Only the owner releases
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ "$ACTOR" != bezmoradi ]; then
            echo "::error::Only bezmoradi starts a release; this run was started by $ACTOR."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag names the release version in version.go, on main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' || [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::$GITHUB_REF isn't a release tag vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_SHA isn't on main; tag a commit on main."
            exit 1
          fi
          source=$(sed -n 's/^const VERSION = "\(v[^"]*\)"$/\1/p' internal/version/version.go)
          if [ "$source" != "$TAG" ]; then
            echo "::error::internal/version/version.go says VERSION is $source, not $TAG; tag the commit that sets it."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the linux archives without cgo
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/release.sh "$VERSION" "$RUNNER_TEMP/dist" linux/amd64 linux/arm64
      - name: Check the linux archives
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dist="$RUNNER_TEMP/dist"
          for target in amd64:x86-64 arm64:aarch64; do
            name="t2-$VERSION-linux-${target%%:*}"
            check="$RUNNER_TEMP/check/$name"
            mkdir -p "$check"
            tar -xzf "$dist/$name.tar.gz" -C "$check" --no-same-owner
            (cd "$check/$name" && sha256sum --strict -c SHA256SUMS && test -x t2)
            kind=$(file -b "$check/$name/t2")
            case $kind in
            "ELF 64-bit"*" ${target#*:},"*"statically linked"*) ;;
            *)
              echo "::error::$name/t2 is $kind, not a static ${target#*:} program."
              exit 1
              ;;
            esac
          done
          got=$("$RUNNER_TEMP/check/t2-$VERSION-linux-amd64/t2-$VERSION-linux-amd64/t2" --version)
          if [ "$got" != "T2 (Talk to Text) v$VERSION" ]; then
            echo "::error::The linux/amd64 t2 reports $got, not v$VERSION."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux
          path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*-NOTICES.txt
          if-no-files-found: error
          retention-days: 1

  darwin:
    needs: version
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the darwin archives with cgo
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/release.sh "$VERSION" "$RUNNER_TEMP/dist" darwin/amd64 darwin/arm64
      - name: Check the darwin archives
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dist="$RUNNER_TEMP/dist"
          for target in amd64:x86_64 arm64:arm64; do
            name="t2-$VERSION-darwin-${target%%:*}"
            check="$RUNNER_TEMP/check/$name"
            mkdir -p "$check"
            tar -xzf "$dist/$name.tar.gz" -C "$check"
            (cd "$check/$name" && shasum -a 256 -c SHA256SUMS && test -x t2)
            if [ "$(lipo -archs "$check/$name/t2")" != "${target#*:}" ]; then
              echo "::error::$name/t2 isn't a ${target#*:} program."
              exit 1
            fi
            if ! otool -L "$check/$name/t2" | grep -q AudioToolbox.framework; then
              echo "::error::$name/t2 doesn't link AudioToolbox, so it was built without cgo."
              exit 1
            fi
            if ! vtool -show-build "$check/$name/t2" | grep -Eqx ' *minos 13\.0'; then
              echo "::error::$name/t2 isn't built for macOS 13.0 and later."
              exit 1
            fi
          done
          got=$("$RUNNER_TEMP/check/t2-$VERSION-darwin-arm64/t2-$VERSION-darwin-arm64/t2" --version)
          if [ "$got" != "T2 (Talk to Text) v$VERSION" ]; then
            echo "::error::The darwin/arm64 t2 reports $got, not v$VERSION."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: darwin
          path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*-NOTICES.txt
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs: [version, linux, darwin]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: darwin
          path: ${{ runner.temp }}/darwin
      - name: Write SHA256SUMS and render install.sh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notices="t2-$VERSION-NOTICES.txt"
          if ! cmp "$RUNNER_TEMP/linux/$notices" "$RUNNER_TEMP/darwin/$notices"; then
            echo "::error::The linux and darwin builds wrote different notices."
            exit 1
          fi
          dist="$RUNNER_TEMP/dist"
          mkdir "$dist"
          mv "$RUNNER_TEMP/linux/$notices" "$RUNNER_TEMP"/linux/t2-"$VERSION"-linux-*.tar.gz "$RUNNER_TEMP"/darwin/t2-"$VERSION"-darwin-*.tar.gz "$dist/"
          sh scripts/release-install.sh "$VERSION" "$dist"
      - name: Check the archives and install.sh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dist="$RUNNER_TEMP/dist"
          (cd "$dist" && sha256sum --strict -c SHA256SUMS)
          [ "$(wc -l < "$dist/SHA256SUMS")" = 6 ]
          install="$dist/install.sh"
          if grep -q '@[A-Z0-9_]*@' "$install" || ! sh -n "$install" || [ "$(grep -cxF "version='$VERSION'" "$install")" != 1 ]; then
            echo "::error::install.sh still holds a placeholder, doesn't parse, or doesn't carry version $VERSION."
            exit 1
          fi
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            name="t2-$VERSION-$target"
            sum=$(awk -v n="$name.tar.gz" 'NF == 2 && $2 == n { print $1 }' "$dist/SHA256SUMS")
            key=$(printf '%s' "$target" | tr - _)
            if ! printf '%s\n' "$sum" | grep -Eqx '[0-9a-f]{64}' || [ "$(grep -cxF "sha256_$key='$sum'" "$install")" != 1 ]; then
              echo "::error::install.sh doesn't carry the SHA256SUMS checksum of $name.tar.gz."
              exit 1
            fi
            check="$RUNNER_TEMP/check/$name"
            mkdir -p "$check"
            tar -xzf "$dist/$name.tar.gz" -C "$check" --no-same-owner
            (cd "$check/$name" && sha256sum --strict -c SHA256SUMS && test -x t2 && cmp NOTICES.txt "$dist/t2-$VERSION-NOTICES.txt")
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*-NOTICES.txt
            ${{ runner.temp }}/dist/SHA256SUMS
            ${{ runner.temp }}/dist/install.sh
          if-no-files-found: error
          retention-days: 1

  attest:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - name: Check the archives and install.sh against SHA256SUMS
        run: cd "$RUNNER_TEMP/dist" && sha256sum --strict -c SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*-NOTICES.txt
            ${{ runner.temp }}/dist/SHA256SUMS
            ${{ runner.temp }}/dist/install.sh
          create-storage-record: false

  draft:
    needs: [version, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - name: Create a draft release with the archives and install.sh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          [ "$TAG" = "v$VERSION" ]
          dist="$RUNNER_TEMP/dist"
          (cd "$dist" && sha256sum --strict -c SHA256SUMS)
          set --
          case "$VERSION" in *-*) set -- --prerelease ;; esac
          fence='```'
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          T2 $VERSION for linux/amd64, linux/arm64, darwin/amd64 and darwin/arm64. Each archive holds \`t2\`, \`LICENSE\`, \`NOTICES.txt\` and a \`SHA256SUMS\` of its files. The darwin programs are built with cgo for macOS 13 and later; the linux ones without cgo.

          Install this version into \`~/.local/bin\` (or \`T2_INSTALL_DIR\`), with curl, tar and sha256sum or shasum, and no Go or Xcode:

          ${fence}bash
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh | sh
          ${fence}

          The script checks the archive for your platform against the SHA-256 it carries and the archive's own \`SHA256SUMS\`. On Linux it warns about the run-time tools t2 needs that aren't installed. To check the script first, download it, run \`gh attestation verify install.sh -R $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref refs/tags/$TAG\`, then \`sh install.sh\`. Or download and check an archive yourself:

          ${fence}bash
          VERSION=$VERSION OS=linux ARCH=amd64
          curl -fsSLO https://github.com/$GITHUB_REPOSITORY/releases/download/v\$VERSION/t2-\$VERSION-\$OS-\$ARCH.tar.gz
          curl -fsSLO https://github.com/$GITHUB_REPOSITORY/releases/download/v\$VERSION/SHA256SUMS
          grep " t2-\$VERSION-\$OS-\$ARCH.tar.gz\$" SHA256SUMS | shasum -a 256 -c -
          gh attestation verify t2-\$VERSION-\$OS-\$ARCH.tar.gz -R $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref refs/tags/v\$VERSION
          ${fence}

          The archives, \`install.sh\`, \`SHA256SUMS\` and the notices carry build provenance signed keylessly with Sigstore by this repository's release workflow for $TAG, from commit $GITHUB_SHA.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag "$@" \
            --title "T2 $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "$dist"/*.tar.gz "$dist"/*-NOTICES.txt "$dist/SHA256SUMS" "$dist/install.sh"
